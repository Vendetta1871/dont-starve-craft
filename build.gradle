plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.0'
group = 'net.celestiald'

base {
    archivesName = 'dontstarve'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.265'

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // Headless test client (tools/autotest.sh): joins the servertest server
        // straight away. -PautotestServer=host:port -PautotestUser=Name
        autotestClient {
            client()
            gameDirectory = project.file('run-autotest')
            programArguments.addAll(
                    '--quickPlayMultiplayer', (project.findProperty('autotestServer') ?: 'localhost:25599').toString(),
                    '--username', (project.findProperty('autotestUser') ?: 'Tester').toString())
        }
    }

    mods {
        dontstarve {
            sourceSet(sourceSets.main)
        }
    }
}
