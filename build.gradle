plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.0'
group = 'dev.dontstarve'

base {
    archivesName = 'dontstarve'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.265'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        dontstarve {
            sourceSet(sourceSets.main)
        }
    }
}
